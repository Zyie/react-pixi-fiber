<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      A frame on the three renderer loads its entry with `?fiber=three`, which the playground's Vite plugin
      carries through every import, so `react-pixi-fiber` resolves to r3f's own entry in this frame only.
    -->
    <script type="module">
      const three = new URLSearchParams(location.search).get('renderer') === 'three';

      import(/* @vite-ignore */ three ? '/src/scene-frame.ts?fiber=three' : '/src/scene-frame.ts');
    </script>
  </body>
</html>
